[package]
name = "server"
version = "0.1.0"
edition = "2021"
publish = false
description = "Lean-backed Expand HTTP server for RV32IMC firmware images"

[dependencies]
axum = "0.8"
base64 = "0.22"
lean-binding = { path = "../lean-binding" }
riscv-isa = "0.3"
xpost-elf = { path = "../../../xpost/xpost-elf" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
