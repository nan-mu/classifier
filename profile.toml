# Test images. Paths are relative to this file.
# libbpf-mcu writes XDP ELF and eBPF objects under ../build/<name>/.
#
# expect is the dual-arch outcome `classifier test` checks:
#   strict — both sides complete, kind counts match, branch expressions unify
#   weak   — both sides complete, kind counts match, some branch expression does not
#   fail   — a side does not complete, or some segment's kind counts disagree

build = "../build"

[[program]]
name = "bitswap"
elf = "bitswap/bitswap.elf"
bpf = "bitswap/bpf.o"
expect = "weak"

[[program]]
name = "bsort"
elf = "bsort/bsort.elf"
bpf = "bsort/bpf.o"
expect = "weak"

[[program]]
name = "buf"
elf = "buf/buf.elf"
bpf = "buf/bpf.o"
expect = "weak"

[[program]]
name = "fib"
elf = "fib/fib.elf"
bpf = "fib/bpf.o"
expect = "weak"

[[program]]
name = "firewall"
elf = "firewall/firewall.elf"
bpf = "firewall/bpf.o"
expect = "strict"

[[program]]
name = "fletcher32"
elf = "fletcher32/fletcher32.elf"
bpf = "fletcher32/bpf.o"
expect = "weak"

[[program]]
name = "helper_loop"
elf = "helper_loop/helper_loop.elf"
bpf = "helper_loop/bpf.o"
expect = "weak"

[[program]]
name = "incr"
